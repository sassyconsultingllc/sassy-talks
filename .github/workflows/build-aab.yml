name: Build Release AAB

on:
  workflow_dispatch:
    inputs:
      publish_to_play:
        description: 'Upload the AAB to Google Play (internal track)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      play_track:
        description: 'Play track to publish to (only used when publish_to_play=true)'
        required: false
        default: 'internal'
        type: choice
        options: ['internal', 'alpha', 'beta', 'production']
  push:
    branches:
      - main
    paths:
      - 'sassy-talk-clean/android-app/**'

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('sassy-talk-clean/android-app/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x sassy-talk-clean/android-app/gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — refusing to build a debug-signed AAB."
            exit 1
          fi
          mkdir -p sassy-talk-clean/android-app/app/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > sassy-talk-clean/android-app/app/keystore/release.keystore
          test -s sassy-talk-clean/android-app/app/keystore/release.keystore || { echo "::error::Decoded keystore is empty"; exit 1; }

      - name: Verify release credentials are present
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          [ -z "$RELEASE_STORE_PASSWORD" ] && { echo "::error::RELEASE_STORE_PASSWORD secret is unset"; missing=1; }
          [ -z "$RELEASE_KEY_ALIAS" ]      && { echo "::error::RELEASE_KEY_ALIAS secret is unset"; missing=1; }
          [ -z "$RELEASE_KEY_PASSWORD" ]   && { echo "::error::RELEASE_KEY_PASSWORD secret is unset"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Build Release AAB
        working-directory: sassy-talk-clean/android-app
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify AAB is signed with release keystore (not debug)
        run: |
          AAB="sassy-talk-clean/android-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB" || { echo "::error::AAB not produced"; exit 1; }
          # Pull the signing cert subject and fail if it's the Android debug cert.
          tmpdir=$(mktemp -d)
          unzip -q -p "$AAB" META-INF/ANDROIDD.RSA > "$tmpdir/cert.rsa" || \
            unzip -q -p "$AAB" "$(unzip -l "$AAB" | awk '/META-INF\/.*\.(RSA|EC|DSA)/ {print $4; exit}')" > "$tmpdir/cert.rsa"
          subject=$(keytool -printcert -file "$tmpdir/cert.rsa" 2>/dev/null | awk -F': ' '/^Owner:/ {print $2; exit}')
          echo "AAB signing cert subject: $subject"
          case "$subject" in
            *"CN=Android Debug"*)
              echo "::error::AAB is signed with the Android debug certificate. Refusing to upload."
              exit 1 ;;
          esac

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sassy-talkie-release-aab
          path: sassy-talk-clean/android-app/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Publish to Google Play
        # Only on manual workflow_dispatch with publish_to_play=true.
        # Pushes never auto-publish — they only build + upload artifact.
        # Note: the very first AAB for a fresh app must be uploaded
        # manually via the Play Console UI (Google API limitation);
        # this step is for v2.4.0+ once v2.3.0 is live.
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_play == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sassyconsulting.sassytalkie
          releaseFiles: sassy-talk-clean/android-app/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track }}
          status: completed
          changesNotSentForReview: false
