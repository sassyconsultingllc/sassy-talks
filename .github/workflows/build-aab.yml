name: Build Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sassy-talk-clean/android-app/**'

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('sassy-talk-clean/android-app/**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x sassy-talk-clean/android-app/gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — refusing to build a debug-signed AAB."
            exit 1
          fi
          mkdir -p sassy-talk-clean/android-app/app/keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > sassy-talk-clean/android-app/app/keystore/release.keystore
          test -s sassy-talk-clean/android-app/app/keystore/release.keystore || { echo "::error::Decoded keystore is empty"; exit 1; }

      - name: Verify release credentials are present
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          [ -z "$RELEASE_STORE_PASSWORD" ] && { echo "::error::RELEASE_STORE_PASSWORD secret is unset"; missing=1; }
          [ -z "$RELEASE_KEY_ALIAS" ]      && { echo "::error::RELEASE_KEY_ALIAS secret is unset"; missing=1; }
          [ -z "$RELEASE_KEY_PASSWORD" ]   && { echo "::error::RELEASE_KEY_PASSWORD secret is unset"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Build Release AAB
        working-directory: sassy-talk-clean/android-app
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS:      ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD:   ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Verify AAB is signed with release keystore (not debug)
        run: |
          AAB="sassy-talk-clean/android-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB" || { echo "::error::AAB not produced"; exit 1; }
          # Pull the signing cert subject and fail if it's the Android debug cert.
          tmpdir=$(mktemp -d)
          unzip -q -p "$AAB" META-INF/ANDROIDD.RSA > "$tmpdir/cert.rsa" || \
            unzip -q -p "$AAB" "$(unzip -l "$AAB" | awk '/META-INF\/.*\.(RSA|EC|DSA)/ {print $4; exit}')" > "$tmpdir/cert.rsa"
          subject=$(keytool -printcert -file "$tmpdir/cert.rsa" 2>/dev/null | awk -F': ' '/^Owner:/ {print $2; exit}')
          echo "AAB signing cert subject: $subject"
          case "$subject" in
            *"CN=Android Debug"*)
              echo "::error::AAB is signed with the Android debug certificate. Refusing to upload."
              exit 1 ;;
          esac

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sassy-talkie-release-aab
          path: sassy-talk-clean/android-app/app/build/outputs/bundle/release/*.aab
          retention-days: 30
