# iOS-only build workflow — builds the SassyTalkie iOS app on macOS runner
# (no Android build, no cloudflare worker, no tauri desktop).
#
# Runs on every push to main that touches ios-native/ or core/.
name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'ios-native/**'
      - 'core/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios-native/**'
      - 'core/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build:
    name: Build SassyTalkie iOS
    runs-on: macos-latest
    env:
      # CMake 4 dropped cmake_minimum_required(< 3.5) compat; audiopus_sys's
      # bundled libopus still declares it.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    defaults:
      run:
        working-directory: ios-native
        # An explicit bash shell runs with -eo pipefail. The default shell
        # does not, so `build.sh | tail` and `xcodebuild | tail` reported
        # success whenever tail did.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch Rust dependencies
        run: cargo fetch

      - name: Build Rust static library for iOS (with verbose output)
        run: |
          set -x
          bash build.sh 2>&1 | tail -100

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project SassyTalkie.xcodeproj \
            -scheme SassyTalkie \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath /tmp/sassytalky-dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -50

      - name: Package simulator .app as zip
        run: |
          cd /tmp/sassytalky-dd/Build/Products/Debug-iphonesimulator
          ls -la
          zip -r /tmp/SassyTalkie-simulator.zip SassyTalkie.app
          ls -la /tmp/SassyTalkie-simulator.zip

      - name: Upload simulator build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: /tmp/SassyTalkie-simulator.zip

      - name: Build for iOS Device (Release) - skipped (requires iOS DeviceSupport)
        if: false
        run: |
          echo "Skipping device build - requires iOS DeviceSupport installation on runner"
          # xcodebuild -project SassyTalkie.xcodeproj \
          #   -scheme SassyTalkie \
          #   -sdk iphoneos \
          #   -configuration Release \
          #   -derivedDataPath /tmp/sassytalky-dd \
          #   build

      - name: Upload device build artifacts
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: ios-device-build
          path: /tmp/SassyTalkie-device.zip
