[package]
name = "sassytalkie-ios"
version = "1.0.0"
edition = "2021"
authors = ["Sassy Consulting LLC"]
license = "Proprietary"
description = "SassyTalkie iOS Native Core - PTT Walkie-Talkie"

[lib]
name = "sassytalkie_ios"
# staticlib only: Xcode links libsassytalkie_ios.a into the app (project.yml
# OTHER_LDFLAGS -lsassytalkie_ios). A cdylib (.dylib) can't be built/loaded for
# an iOS device target and was failing the link step.
crate-type = ["staticlib"]

[dependencies]
# Audio codec — pinned to the same resolvable release the desktop crate uses
# (plain "0.3" selects nothing on crates.io; only 0.3.0-rc.0 is published).
audiopus = { version = "0.3.0-rc.0", default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Networking
socket2 = "0.5"

# Crypto
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"

# Concurrency
parking_lot = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

# Lock-free ring buffer for the audio capture/playback path
ringbuf = "0.3"

# Error handling
thiserror = "1.0"

# iOS FFI
core-foundation = "0.9"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
# iOS-specific dependencies
objc = "0.2"
block = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
